name: DAST Scan

on:
  pull_request:
    branches: [main, master]

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ZAP (Docker)
        run: |
          docker run -d --name zap -u zap -p 8080:8080 -i ghcr.io/zaproxy/zaproxy:stable zap.sh -daemon -port 8080 -config api.disablekey=true
          # wait for zap to be reachable
          sleep 10

      - name: Run DAST
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          python run_scan.py --target $TARGET_URL --config config.yaml

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/
# GitHub Actions Workflow - .github/workflows/dast.yml
